name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: cargo fmt (formatting gate)
        run: cargo fmt --all --check
      - name: cargo clippy (lint gate, warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test (golden vectors + round-trips)
        run: cargo test --workspace
      - name: wasm build smoke (fcb-wasm bridge on wasm32)
        run: cargo build -p fcb-wasm --target wasm32-unknown-unknown
