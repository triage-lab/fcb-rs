name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test (golden vectors + round-trips)
        run: cargo test --workspace
      - name: wasm build smoke (native == wasm codec)
        run: cargo build -p fcb --target wasm32-unknown-unknown
