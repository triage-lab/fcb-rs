[package]
name = "fcb-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM / JS bindings for the FCB codec — the in-browser workbench bridge"
license = "ECL-2.0"
repository = "https://github.com/triage-lab/fcb-rs"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fcb = { path = "../fcb" }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2"
features = ["js"]
