[package]
name = "fcb-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM / JS bindings for the FCB codec — the in-browser workbench bridge"
license = "ECL-2.0"
repository = "https://github.com/triage-lab/fcb-rs"
readme = "../../README.md"
keywords = ["forensics", "wasm", "cbor", "codec", "evidence"]
categories = ["wasm", "encoding", "cryptography"]
authors = ["The fcb-rs Authors"]
documentation = "https://docs.rs/fcb-wasm"
rust-version = "1.87"

# No `[package.metadata.docs.rs]` target override is set: fcb-wasm's public Rust
# API (peek, open_case, pack_case, …) is NOT cfg-gated, so it renders fully on
# the default x86_64 docs.rs build. The JS bindings (peekHeader, openCase,
# packCase, …) live in a private, wasm32-only `mod wasm_api` that rustdoc never
# emits on any target. Forcing docs.rs to wasm32-unknown-unknown would add
# cross-compile fragility (a failed wasm build = zero docs) with no docs benefit.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fcb = { path = "../fcb", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2"
features = ["js"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
