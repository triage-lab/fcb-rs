[package]
name = "fcb"
version = "0.1.0"
edition = "2021"
description = "Forensic Case Bundle (FCB) codec — container, passphrase crypto, compression, evidence model"
license = "ECL-2.0"
repository = "https://github.com/triage-lab/fcb-rs"
readme = "../../README.md"
keywords = ["forensics", "cbor", "codec", "evidence", "encryption"]
categories = ["encoding", "cryptography"]
authors = ["The fcb-rs Authors"]
documentation = "https://docs.rs/fcb"
# MSRV floor: 1.87 is the highest declared rust-version among the locked
# dependencies — set by ruzstd 0.8.3 (twox-hash 2.1.2 = 1.81, wasm-bindgen 0.2
# = 1.77, thiserror 2 = 1.68, argon2 0.5 = 1.65). Cargo.lock pins these resolved
# versions, but the caret ranges above (e.g. ruzstd = "0.8") still admit future
# patch releases whose MSRV could climb past 1.87 after a `cargo update`. There
# is intentionally no MSRV-enforcement gate in this change; the pinned-toolchain
# CI check that catches such drift is owned by reproducible-wasm-npm-pipeline.
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ruzstd = "0.8"
sha2 = "0.10"
thiserror = "2"
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
